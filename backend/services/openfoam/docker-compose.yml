version: '3.8'

services:
  openfoam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gfdde-openfoam
    ports:
      - "5004:5004"
    volumes:
      - ./cases:/cases
      - ./results:/results
    environment:
      - FOAM_INST_DIR=/opt/openfoam10
      - WM_PROJECT_DIR=/opt/openfoam10/OpenFOAM-10
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5004/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
